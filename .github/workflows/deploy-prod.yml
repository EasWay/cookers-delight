name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  gate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation mismatch. Aborting."
            exit 1
          fi

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: gate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Record pre-deploy commit
        id: pre-deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/cookers-delight
            git rev-parse HEAD

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd /opt/cookers-delight

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "$PREV_COMMIT" > /tmp/cd-prev-commit

            echo "── Pulling latest main ──"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "── Building + starting containers ──"
            export IGNITER_CARTE_KEY="${{ secrets.IGNITER_CARTE_KEY }}"
            export MYSQL_ROOT_PASSWORD="${{ secrets.PROD_DB_ROOT_PASSWORD }}"
            export MYSQL_DATABASE=cookers_delight
            export MYSQL_USER=cd_user
            export MYSQL_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}"
            export VITE_TI_API_URL="${{ vars.PROD_VITE_TI_API_URL }}"
            export VITE_TI_API_TOKEN="${{ secrets.PROD_VITE_TI_API_TOKEN }}"
            export VITE_TI_BASE_URL="${{ vars.PROD_VITE_TI_BASE_URL }}"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "── Running migrations ──"
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T backend php artisan migrate --force

            echo "── Health check ──"
            sleep 15
            curl -fsS http://localhost/api/health || (echo "Health check failed"; exit 1)

            echo "── Deployment complete ──"

      - name: Auto-rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/cookers-delight
            PREV_COMMIT=$(cat /tmp/cd-prev-commit 2>/dev/null || echo "")
            if [ -z "$PREV_COMMIT" ]; then
              echo "No previous commit found — cannot rollback"
              exit 1
            fi

            echo "── Rolling back to $PREV_COMMIT ──"
            git reset --hard "$PREV_COMMIT"

            export MYSQL_ROOT_PASSWORD="${{ secrets.PROD_DB_ROOT_PASSWORD }}"
            export MYSQL_DATABASE=cookers_delight
            export MYSQL_USER=cd_user
            export MYSQL_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "── Rollback complete ──"
