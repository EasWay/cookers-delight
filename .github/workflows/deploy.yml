# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — Production Deploy
# Triggers: push to main (after CI passes)
#
# Required GitHub Secrets:
#   DEPLOY_HOST          → DigitalOcean droplet IP or domain
#   DEPLOY_USER          → SSH user (e.g. "deploy" or "root")
#   DEPLOY_SSH_KEY       → Private SSH key (base64-encoded or raw PEM)
#   DEPLOY_PATH          → Path on server (e.g. /var/www/cookers-delight)
#   PAYSTACK_SECRET_KEY  → Paystack secret key (for runtime .env on server)
#   PAYSTACK_PUBLIC_KEY  → Paystack public key
#   PAYSTACK_WEBHOOK_SECRET → Webhook HMAC secret
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Build React frontend ──────────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React SPA
        run: pnpm run build
        env:
          VITE_TI_API_URL: ${{ secrets.VITE_TI_API_URL }}
          VITE_TI_API_TOKEN: ${{ secrets.VITE_TI_API_TOKEN }}
          VITE_QR_ORDER_URL: ${{ secrets.VITE_QR_ORDER_URL }}

      # ── SSH deploy ────────────────────────────────────────────────────────
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload built React SPA
        run: |
          rsync -az --delete dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/dist/

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Installing backend Composer deps ==="
            cd backend
            composer install --no-dev --no-interaction --optimize-autoloader
            cd ..

            echo "=== Installing QR Composer deps ==="
            cd qr-ordering
            composer install --no-dev --no-interaction --optimize-autoloader
            cd ..

            echo "=== Running database migrations ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend php artisan migrate --force --no-interaction

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T qr php artisan migrate --force --no-interaction

            echo "=== Rebuilding and restarting containers ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --build --remove-orphans

            echo "=== Caching Laravel config/routes ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend php artisan config:cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend php artisan route:cache
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T backend php artisan view:cache

            echo "=== Deployment complete ✅ ==="
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 10
          curl -sSf https://${{ secrets.DEPLOY_HOST }}/api/announcements \
            -o /dev/null -w "HTTP %{http_code}" \
            || echo "Health check warning — check server logs"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment FAILED. Check logs above."
