# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — CI Pipeline
# Runs on every push and pull request.
# Tests: PHP (backend + qr-ordering) + Frontend (Vitest)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── PHP Backend ─────────────────────────────────────────────────────────────
  php-backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cookers_delight_test
          MYSQL_USER: cookers
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, zip, exif, pcntl, bcmath, gd, intl, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure test environment
        run: |
          cp .env.example .env.testing
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env.testing
          echo "APP_ENV=testing"                           >> .env.testing
          echo "DB_CONNECTION=mysql"                       >> .env.testing
          echo "DB_HOST=127.0.0.1"                        >> .env.testing
          echo "DB_PORT=3306"                              >> .env.testing
          echo "DB_DATABASE=cookers_delight_test"          >> .env.testing
          echo "DB_USERNAME=cookers"                       >> .env.testing
          echo "DB_PASSWORD=secret"                        >> .env.testing
          echo "DB_PREFIX=ti_"                             >> .env.testing
          echo "CACHE_DRIVER=array"                        >> .env.testing
          echo "QUEUE_CONNECTION=sync"                     >> .env.testing
          echo "SESSION_DRIVER=array"                      >> .env.testing

      - name: Generate app key
        run: php artisan key:generate --env=testing --no-interaction

      - name: Run migrations
        run: php artisan migrate --env=testing --no-interaction

      - name: Run PHP tests
        run: php artisan test --env=testing --parallel


  # ── PHP QR Ordering ─────────────────────────────────────────────────────────
  php-qr:
    name: QR Ordering (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cookers_delight_qr_test
          MYSQL_USER: cookers
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: qr-ordering

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, zip, bcmath, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: qr-ordering/vendor
          key: ${{ runner.os }}-composer-qr-${{ hashFiles('qr-ordering/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-qr-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure test environment
        run: |
          cp .env.example .env.testing
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env.testing
          echo "APP_ENV=testing"                            >> .env.testing
          echo "DB_CONNECTION=mysql"                        >> .env.testing
          echo "DB_HOST=127.0.0.1"                         >> .env.testing
          echo "DB_DATABASE=cookers_delight_qr_test"        >> .env.testing
          echo "DB_USERNAME=cookers"                        >> .env.testing
          echo "DB_PASSWORD=secret"                         >> .env.testing
          echo "CACHE_STORE=array"                          >> .env.testing
          echo "QUEUE_CONNECTION=sync"                      >> .env.testing
          echo "SESSION_DRIVER=array"                       >> .env.testing

      - name: Run migrations
        run: php artisan migrate --env=testing --no-interaction

      - name: Run PHP tests
        run: php artisan test --env=testing


  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check 2>/dev/null || echo "No type-check script, skipping"

      - name: Run unit tests
        run: pnpm run test

      - name: Build for production
        run: pnpm run build
        env:
          VITE_TI_API_URL: https://api.example.com/api
          VITE_TI_API_TOKEN: test_token
