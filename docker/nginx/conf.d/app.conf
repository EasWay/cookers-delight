# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — Dev Virtual Host
#
# Routing:
#   /api/*          → backend (TastyIgniter PHP-FPM :9000)
#   /v1/*           → backend (TastyIgniter REST API)
#   /igniter/*      → backend (TI admin panel)
#   /table/*        → qr-ordering (kawax PHP-FPM :9000)
#   /qr/*           → qr-ordering
#   /kitchen/*      → qr-ordering
#   /orders/*       → qr-ordering
#   /checkout/*     → qr-ordering
#   /PayStack/*     → qr-ordering webhook
#   /app/*          → reverb (WebSocket :8080)
#   /apps/*         → reverb (Pusher-protocol)
#   everything else → vite dev server (React SPA :5173)
# ─────────────────────────────────────────────────────────────────────────────

# ─── Upstream definitions ─────────────────────────────────────────────────────
upstream php_backend {
    server backend:9000;
}

upstream php_qr {
    server qr:9000;
}

upstream vite_dev {
    server vite:5173;
}

upstream reverb_ws {
    server reverb:8080;
}

# ─── Main server block ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # ── Reverb WebSocket ───────────────────────────────────────────────────
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Backend (TastyIgniter) paths ──────────────────────────────────────
    location ~ ^/(api|v1|igniter|paystack/webhook|setup)/ {
        root /var/www/backend/public;
        try_files $uri $uri/ @backend_php;

        # Serve static assets directly from backend/public
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location @backend_php {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/(api|v1|igniter|paystack/webhook|setup)/.*\.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_read_timeout 60;
    }

    # ── QR Ordering (kawax) paths ─────────────────────────────────────────
    location ~ ^/(table|qr|kitchen|orders|checkout|PayStack|debug-menu|menu)/ {
        root /var/www/qr-ordering/public;
        try_files $uri $uri/ @qr_php;
    }

    location @qr_php {
        fastcgi_pass php_qr;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/qr-ordering/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/qr-ordering/public;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Vite HMR WebSocket ────────────────────────────────────────────────
    location /@vite/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ── React SPA + Vite Dev Server ───────────────────────────────────────
    location / {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_read_timeout 86400;
    }
}
