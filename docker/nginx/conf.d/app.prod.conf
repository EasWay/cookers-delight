# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — Production Virtual Host
# React SPA is served as static files from /var/www/web/dist
# ─────────────────────────────────────────────────────────────────────────────

upstream php_backend {
    server backend:9000;
    keepalive 16;
}

upstream php_qr {
    server qr:9000;
    keepalive 16;
}

upstream reverb_ws {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # ── Security ──────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Reverb WebSocket ──────────────────────────────────────────────────
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── Backend (TastyIgniter) ─────────────────────────────────────────────
    location ~ ^/(api|v1|igniter|setup)/ {
        root /var/www/backend/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;

        # CORS for the SPA
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location ~ ^/(api|v1|igniter|setup)/.*\.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors on;
    }

    location @backend_php {
        fastcgi_pass php_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Paystack Webhook (backend) ─────────────────────────────────────────
    location = /api/paystack/webhook {
        fastcgi_pass php_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_read_timeout 30;
    }

    # ── QR Ordering (kawax) ────────────────────────────────────────────────
    location ~ ^/(table|qr|kitchen|orders|checkout|PayStack|menu)/ {
        root /var/www/qr-ordering/public;
        index index.php;
        try_files $uri $uri/ @qr_php;
    }

    location @qr_php {
        fastcgi_pass php_qr;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/qr-ordering/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/qr-ordering/public;
        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Backend/QR static assets ──────────────────────────────────────────
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── React SPA static files ─────────────────────────────────────────────
    root /var/www/web/dist;
    index index.html;

    # Immutable cache for hashed assets (Vite generates content-hashed filenames)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifest + service worker — short cache
    location ~* (manifest\.json|sw\.js|workbox-.*)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
