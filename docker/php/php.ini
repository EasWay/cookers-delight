; ─── Cookers Delight PHP Configuration ────────────────────────────────────────

[PHP]
; Error reporting (overridden per-environment via APP_DEBUG)
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 20M
post_max_size = 25M
max_input_vars = 3000

; Timezone (West Africa Time)
date.timezone = Africa/Accra

; Session
session.gc_maxlifetime = 7200

; ─── OPcache (toggled per environment via PHP_OPCACHE_ENABLE env var) ────────
[opcache]
opcache.enable = ${PHP_OPCACHE_ENABLE:-0}
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0        ; 0 = never revalidate (prod); use 2 for dev
opcache.fast_shutdown = 1
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
