worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain text/css application/json application/javascript text/xml;

    # ── cookersdelight.com — public website ──────────────────────────────────
    server {
        listen 80;
        server_name cookersdelight.com www.cookersdelight.com;

        if ($host = 'www.cookersdelight.com') {
            return 301 https://cookersdelight.com$request_uri;
        }

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://cookersdelight.com$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name cookersdelight.com;

        ssl_certificate     /etc/letsencrypt/live/cookersdelight.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cookersdelight.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/web;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            fastcgi_pass   backend:9000;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param  REQUEST_URI $request_uri;
            include        fastcgi_params;
            fastcgi_read_timeout 120;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── qr.cookersdelight.com — QR ordering app ──────────────────────────────
    server {
        listen 80;
        server_name qr.cookersdelight.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://qr.cookersdelight.com$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name qr.cookersdelight.com;

        ssl_certificate     /etc/letsencrypt/live/qr.cookersdelight.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qr.cookersdelight.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/qr;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            fastcgi_pass   backend:9000;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param  REQUEST_URI $request_uri;
            include        fastcgi_params;
            fastcgi_read_timeout 120;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
