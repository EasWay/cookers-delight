services:

  backend:
    build:
      target: runtime
    env_file: ./backend/.env
    environment:
      APP_ENV:   local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "9000:9000"

  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  queue:
    environment:
      APP_ENV:   local
      APP_DEBUG: "true"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor

  vite:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "npm install -g pnpm &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_TI_API_URL:  http://localhost:8000/api
      VITE_TI_BASE_URL: http://localhost:8000

  vite-qr:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/apps/qr/node_modules
    command: >
      sh -c "npm install -g pnpm &&
             cd apps/qr &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"

  nginx-dev:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - backend
