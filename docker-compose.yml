# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — Development Environment
#
# Usage:
#   make up          Start all services
#   make down        Stop all services
#   make shell       Shell into the backend container
#   make logs        Tail all service logs
#
# All services share one network. Nginx on :80 is the single entry point.
# ─────────────────────────────────────────────────────────────────────────────

name: cookers-delight

services:

  # ── Nginx — single HTTP entry point ───────────────────────────────────────
  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./qr-ordering/public:/var/www/qr-ordering/public:ro
      - backend_storage:/var/www/backend/storage
    depends_on:
      - backend
      - qr
      - vite
    networks:
      - appnet
    restart: unless-stopped

  # ── Backend — TastyIgniter (PHP 8.3 FPM) ──────────────────────────────────
  backend:
    build:
      context: docker/php
      dockerfile: Dockerfile
      args:
        APP_DIR: backend
    environment:
      - APP_ENV=local
      - PHP_OPCACHE_ENABLE=0
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - backend_storage:/var/www/backend/storage
    working_dir: /var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  # ── QR Ordering — kawax/self-ordering (PHP 8.3 FPM) ──────────────────────
  qr:
    build:
      context: docker/php
      dockerfile: Dockerfile
      args:
        APP_DIR: qr-ordering
    environment:
      - APP_ENV=local
      - PHP_OPCACHE_ENABLE=0
    env_file:
      - qr-ordering/.env
    volumes:
      - ./qr-ordering:/var/www/qr-ordering
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    working_dir: /var/www/qr-ordering
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - appnet
    restart: unless-stopped

  # ── Horizon — Laravel Queue Worker (backend) ──────────────────────────────
  horizon:
    build:
      context: docker/php
      dockerfile: Dockerfile
      args:
        APP_DIR: backend
    command: ["php", "artisan", "horizon"]
    env_file:
      - backend/.env
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage
    working_dir: /var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  # ── Reverb — Laravel WebSocket Server ─────────────────────────────────────
  reverb:
    build:
      context: docker/php
      dockerfile: Dockerfile
      args:
        APP_DIR: backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    env_file:
      - backend/.env
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage
    working_dir: /var/www/backend
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  # ── Vite — React Dev Server (HMR) ─────────────────────────────────────────
  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    volumes:
      - .:/app
      - vite_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_DEV_PROXY_TARGET=http://backend:9000
    networks:
      - appnet
    restart: unless-stopped

  # ── MySQL 8.0 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: cookers_delight
      MYSQL_USER: cookers
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Redis 7.2 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Mailpit — Local Email Testing ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web UI → http://localhost:8025
    networks:
      - appnet
    restart: unless-stopped

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  backend_storage:
  vite_modules:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  appnet:
    driver: bridge
