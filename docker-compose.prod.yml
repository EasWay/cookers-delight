# ─────────────────────────────────────────────────────────────────────────────
# Cookers Delight — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (or via: make deploy-stack)
#
# Differences from dev:
#   - Vite and Mailpit are removed
#   - PHP OPcache is ON
#   - Restart policies enforced
#   - Log rotation set
#   - Health checks added to all services
#   - React SPA served as static build (Nginx directly)
# ─────────────────────────────────────────────────────────────────────────────

name: cookers-delight

services:

  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./docker/nginx/conf.d/app.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./qr-ordering/public:/var/www/qr-ordering/public:ro
      - ./dist:/var/www/web/dist:ro           # Built React SPA
      - backend_storage:/var/www/backend/storage
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: docker/php
      dockerfile: Dockerfile.prod
      args:
        APP_DIR: backend
    environment:
      - APP_ENV=production
      - PHP_OPCACHE_ENABLE=1
    env_file:
      - backend/.env.production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  qr:
    build:
      context: docker/php
      dockerfile: Dockerfile.prod
      args:
        APP_DIR: qr-ordering
    environment:
      - APP_ENV=production
      - PHP_OPCACHE_ENABLE=1
    env_file:
      - qr-ordering/.env.production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  horizon:
    build:
      context: docker/php
      dockerfile: Dockerfile.prod
      args:
        APP_DIR: backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  reverb:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Remove dev-only services ───────────────────────────────────────────────
  vite:
    profiles: ["dev-only"]   # Excluded in prod

  mailpit:
    profiles: ["dev-only"]   # Excluded in prod

  mysql:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
